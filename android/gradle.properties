org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# ⚠ BUILD JDK 21 TALAB QILADI: Yandex MapKit AAR Java 21 bytecode (v65) bilan
# kompilyatsiya qilingan, JDK 17 bilan "Unsupported class file major version" beradi.
#
# Yo'l SHU YERGA YOZILMAYDI — u har kompyuterda boshqacha. Ilgari bu yerda bitta
# dasturchining macOS yo'li (/Users/macbookpro/...) qotib qolgan edi va boshqa
# hamma joyda build "Java home supplied is invalid" bilan yiqilardi.
#
# O'rniga har kim O'Z mashinasida bir marta sozlaydi (bu fayl git'da EMAS):
#   ~/.gradle/gradle.properties  →  org.gradle.java.home=<JDK 21 yo'li>
# yoki JAVA_HOME ni JDK 21 ga qarating.
#
# Tayyor JDK 21 odatda Android Studio ichida bor:
#   Windows : C:/Program Files/Android/Android Studio/jbr
#   macOS   : /Applications/Android Studio.app/Contents/jbr/Contents/Home
#   Linux   : /opt/android-studio/jbr
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Yandex MapKit native SDK variant (lite | full). east_quest bilan bir xil — full.
yandexMapkit.variant=full
