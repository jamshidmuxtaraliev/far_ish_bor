name: jobUp24
description: "JobUp24"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Local database
  shared_preferences:

  # State management
  formz:
  dartz:
  bloc:
  flutter_bloc:
  equatable:

  # Dependency injection
  get_it:

  # Network
  shimmer:
  overlay_support: ^2.1.0
  json_annotation:
  dio:
  socket_io_client: ^3.1.4
  flutter_alice: ^2.0.1

  flutter_localizations:
    sdk: flutter

  # File & image
  image_picker: ^1.0.0
  file_picker:
  path_provider: ^2.1.3
  path: ^1.8.3
  open_filex: ^4.5.0
  share_plus: ^10.1.4

  # Media preview
  cached_network_image:
  flutter_svg:

  # UI components
  auto_size_text:
  cherry_toast:
  iconsax:
  mask_text_input_formatter: ^2.4.0
  infinite_scroll_pagination:
  flutter_html: ^3.0.0-beta.2

  # Audio & Video
  just_audio:
  video_player:

  # Utils
  intl:
  connectivity_plus:
  url_launcher:
  permission_handler:

  # Location & maps (Suhbatlar — jonli GPS kuzatuv)
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0

  cupertino_icons: ^1.0.8
  yandex_mapkit: ^4.2.1

  # Push bildirishnomalar (FCM). Backend tomoni zero-dep HTTP v1 —
  # `services/notifier/channels/fcm.channel.js`, kalit `backend/jobup24.json`.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Ilova OCHIQ turganda Android push'ni O'ZI ko'rsatmaydi — banner shu paket
  # bilan chiziladi (va Android 8+ uchun kanallar shu yerda yaratiladi).
  flutter_local_notifications: ^18.0.1

# ─────────────────────────────────────────────────────────────────────
# dependency_overrides — TRANZITIV paketlarni Flutter 3.44.0 ga moslash.
#
# Bu uchtasi bevosita bog'liqlik EMAS, boshqa paketlar orqali keladi
# (cached_network_image, shimmer, flutter_html ...). Ular pinlanmasa pub eng
# oxirgi versiyani oladi va build Dart kompilyatsiyasida yiqiladi.
#
#   material_ui / cupertino_ui:
#     1.3.0 va 1.1.0 (2026-09-15) `@awaitNotRequired` ni ishlatadi. U `meta`
#     paketida bor, LEKIN Flutter 3.44.0 ning `foundation.dart` si meta'ni aniq
#     `show ...` ro'yxati bilan eksport qiladi va unda `awaitNotRequired` YO'Q.
#     Natija: "Error: Undefined name 'awaitNotRequired'" (~10 ta fayl).
#     Paketlar `flutter: ">=3.44.0"` deb da'vo qiladi, aslida undan yangirog'i kerak.
#
#   html:
#     flutter_html 3.0.0 `package:html/src/query_selector.dart` (ICHKI fayl) dan
#     `matches()` ni chaqiradi. html 0.15.7 da o'sha funksiya olib tashlangan →
#     "Error: Method not found: 'matches'". 0.15.6 da bor.
#
# Flutter versiyasi ko'tarilganda (`.fvmrc`) bu pinlarni qayta ko'rib chiqing.
# ─────────────────────────────────────────────────────────────────────
dependency_overrides:
  material_ui: 1.2.0
  cupertino_ui: 1.0.2
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable:
  build_runner:
  intl_utils: ^2.8.5
  flutter_lints: ^5.0.0

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/generated/l10n
  main_locale: ru

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/icons/navbar_icons/
    - assets/fonts/gotham_pro/
    - assets/fonts/montserrat/
    - assets/fonts/poppins/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800

    - family: GothamPro
      fonts:
        - asset: assets/fonts/gotham_pro/gothampro.ttf
        - asset: assets/fonts/gotham_pro/gothampro_black.ttf
          weight: 900
        - asset: assets/fonts/gotham_pro/gothampro_bold.ttf
          weight: 700
        - asset: assets/fonts/gotham_pro/gothampro_light.ttf
          weight: 300
        - asset: assets/fonts/gotham_pro/gothampro_medium.ttf
          weight: 500

    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/montserrat/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/montserrat/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Thin.ttf
          weight: 100
